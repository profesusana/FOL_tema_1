<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabajo y salud — Cuestionario interactivo</title>
  <meta name="description" content="Cuestionario interactivo autocorregible sobre Trabajo y salud con 150 preguntas organizadas por epígrafes." />
  <style>
    :root {
      --bg-page: #FFF3E5;
      --bg-surface: #FFFFFF;
      --bg-subtle: #FFF3E5;
      --border-color: #F3C58D;
      --border-strong: #C96A0A;
      --text-primary: #2B1B0A;
      --text-secondary: #5C3D1E;
      --text-muted: #5C3D1E;
      --primary: #F28C28;
      --primary-hover: #E07B18;
      --primary-dark: #C96A0A;
      --primary-soft: #FFF3E5;
      --success: #15803D;
      --success-bg: #DCFCE7;
      --success-soft: rgba(220, 252, 231, 0.45);
      --error: #B91C1C;
      --error-bg: #FEE2E2;
      --error-soft: rgba(254, 226, 226, 0.5);
      --radius-lg: 12px;
      --radius-md: 8px;
      --shadow-sm: 0 1px 3px rgba(43, 27, 10, 0.06);
      --shadow-lg: 0 10px 25px rgba(43, 27, 10, 0.16);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.45;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--primary-dark);
      outline-offset: 2px;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .container {
      width: 100%;
      max-width: 1040px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 8px 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .container.is-home {
      max-width: 640px;
      padding: 12px;
      justify-content: center;
    }

    .container.is-exam {
      max-width: 1160px;
    }

    .container.is-results {
      max-width: 860px;
      justify-content: flex-start;
      padding: 18px 14px 28px;
    }

    @media (min-width: 640px) {
      .container {
        justify-content: center;
        padding: 16px 20px;
      }
      .container.is-home {
        padding: 20px;
      }
      .container.is-results {
        justify-content: flex-start;
        padding: 28px 20px;
      }
    }

    .card {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    @media (min-width: 640px) {
      .card {
        padding: 24px;
      }
      .container.is-home .card {
        padding: 28px;
      }
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--primary-dark);
      margin: 0;
    }

    .home-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    @media (min-width: 640px) {
      .home-title {
        font-size: 26px;
      }
    }

    .home-desc {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    .home-attribution {
      margin: 8px 0 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--primary-dark);
    }

    .mode-tabs {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--primary-soft);
    }

    .mode-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 6px;
      background-color: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .mode-tab:hover {
      background-color: rgba(255, 255, 255, 0.7);
      color: var(--text-primary);
    }

    .mode-tab.is-active {
      border-color: var(--primary-dark);
      background-color: var(--primary);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(43, 27, 10, 0.08);
    }

    .home-controls {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(243, 197, 141, 0.7);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .title {
      margin: 6px 0 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    @media (min-width: 640px) {
      .title {
        font-size: 28px;
      }
    }

    .intro-desc {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    @media (min-width: 640px) {
      .intro-desc {
        font-size: 15px;
      }
    }

    .divider-bottom {
      border-bottom: 1px solid rgba(243, 197, 141, 0.7);
      padding-bottom: 18px;
    }

    .section-block {
      margin-top: 22px;
    }

    .section-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }

    .select-wrap {
      position: relative;
      margin-top: 6px;
    }

    .select-control {
      width: 100%;
      min-height: 44px;
      padding: 8px 40px 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .select-control:hover {
      border-color: var(--primary-dark);
    }

    .select-chevron {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--primary-dark);
      display: flex;
    }

    .toggle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--primary-soft);
      cursor: pointer;
    }

    .toggle-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .toggle-checkbox {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 20px;
      border: 1px solid var(--primary-dark);
      border-radius: var(--radius-md);
      background-color: var(--primary);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.15s ease;
    }

    .btn-primary.btn-full {
      width: 100%;
      min-height: 46px;
      font-size: 16px;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-secondary svg {
      color: var(--primary-dark);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--primary-soft);
      border-color: var(--primary-dark);
    }

    .btn-secondary:disabled {
      opacity: 0.45;
    }

    .btn-subtle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 42px;
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--primary-soft);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .btn-subtle:hover:not(:disabled) {
      border-color: var(--primary-dark);
      color: var(--text-primary);
    }

    .btn-errors-home {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 42px;
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: rgba(255, 243, 229, 0.72);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-errors-home:hover:not(:disabled) {
      background-color: var(--primary-soft);
      border-color: var(--primary-dark);
    }

    .btn-errors-home:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .btn-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius-md);
      background-color: var(--error);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-danger:hover {
      background-color: #991B1B;
    }

    .exam-rules-box {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--primary-soft);
      padding: 16px;
    }

    .exam-rules-list {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .exam-rules-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    /* Barra superior del cuestionario y examen */
    .quiz-topbar {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
    }

    @media (min-width: 640px) {
      .quiz-topbar {
        padding: 12px 20px;
      }
    }

    .quiz-topbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .quiz-counter {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .badge-errors-pill {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--primary-soft);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }

    @media (min-width: 640px) {
      .badge-errors-pill {
        display: inline-flex;
      }
    }

    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 4px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--primary-soft);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
    }

    .timer-pill.is-low {
      border-color: rgba(185, 28, 28, 0.45);
      background-color: rgba(254, 226, 226, 0.7);
      color: var(--error);
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: var(--primary-soft);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--primary);
      transition: width 0.2s ease;
    }

    .question-header {
      border-bottom: 1px solid rgba(243, 197, 141, 0.6);
      padding-bottom: 12px;
    }

    .question-text {
      margin: 6px 0 0;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text-primary);
    }

    @media (min-width: 640px) {
      .question-text {
        font-size: 18px;
      }
    }

    .options-list {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    @media (min-width: 640px) {
      .options-list {
        margin-top: 14px;
        gap: 10px;
      }
    }

    @media (min-width: 768px) {
      .options-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      min-height: 42px;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      text-align: left;
      font-size: 14px;
      line-height: 1.38;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    @media (min-width: 640px) {
      .option-btn {
        gap: 12px;
        min-height: 48px;
        padding: 10px 14px;
        font-size: 15px;
      }
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-dark);
      background-color: var(--primary-soft);
    }

    .option-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      margin-top: 1px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--primary-soft);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 700;
    }

    .option-text {
      flex: 1;
    }

    .option-btn.is-correct {
      border-color: var(--success);
      background-color: var(--success-soft);
      color: var(--text-primary);
    }

    .option-btn.is-correct .option-letter {
      border-color: var(--success);
      background-color: var(--success);
      color: #FFFFFF;
    }

    .option-btn.is-wrong {
      border-color: var(--error);
      background-color: var(--error-soft);
      color: var(--text-primary);
    }

    .option-btn.is-wrong .option-letter {
      border-color: var(--error);
      background-color: var(--error);
      color: #FFFFFF;
    }

    .option-btn.is-muted {
      border-color: rgba(243, 197, 141, 0.6);
      background-color: rgba(255, 243, 229, 0.35);
      color: rgba(92, 61, 30, 0.75);
    }

    .option-btn.is-selected-exam {
      border-color: var(--primary-dark);
      background-color: var(--primary-soft);
      box-shadow: inset 0 0 0 1px var(--primary-dark);
    }

    .option-btn.is-selected-exam .option-letter {
      border-color: var(--primary-dark);
      background-color: var(--primary);
      color: var(--text-primary);
    }

    .feedback-box {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
    }

    .feedback-box.is-correct {
      border-color: rgba(21, 128, 61, 0.3);
      background-color: var(--success-soft);
    }

    .feedback-box.is-wrong {
      border-color: rgba(185, 28, 28, 0.3);
      background-color: var(--error-soft);
    }

    .feedback-box.is-omitted {
      border-color: rgba(201, 106, 10, 0.4);
      background-color: var(--primary-soft);
    }

    .feedback-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .feedback-box.is-correct .feedback-status {
      color: var(--success);
    }

    .feedback-box.is-wrong .feedback-status {
      color: var(--error);
    }

    .feedback-box.is-omitted .feedback-status {
      color: var(--primary-dark);
    }

    .feedback-body {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(43, 27, 10, 0.1);
    }

    .feedback-label {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .feedback-explanation {
      margin: 3px 0 0;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-primary);
    }

    .quiz-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(243, 197, 141, 0.7);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .quiz-footer-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .quiz-footer-omit {
      order: 3;
      width: 100%;
    }

    @media (min-width: 640px) {
      .quiz-footer {
        margin-top: 14px;
        padding-top: 12px;
      }
      .quiz-footer-omit {
        order: 0;
        width: auto;
      }
      .quiz-footer-group.is-right {
        justify-content: flex-end;
      }
    }

    /* Layout del Modo Examen + panel numérico */
    .exam-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start;
    }

    @media (min-width: 1024px) {
      .exam-layout {
        grid-template-columns: minmax(0, 1fr) 244px;
      }
    }

    .exam-sidebar {
      display: none;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    @media (min-width: 1024px) {
      .exam-sidebar {
        display: block;
      }
      .exam-mobile-nav-btn,
      .exam-mobile-nav-drawer {
        display: none !important;
      }
    }

    .exam-nav-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    @media (min-width: 640px) {
      .exam-nav-grid {
        grid-template-columns: repeat(9, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .exam-nav-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    .exam-nav-btn {
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .exam-nav-btn:hover {
      border-color: var(--primary-dark);
      background-color: var(--primary-soft);
    }

    .exam-nav-btn.is-answered {
      border-color: var(--primary-dark);
      background-color: rgba(242, 140, 40, 0.25);
      color: var(--text-primary);
      font-weight: 700;
    }

    .exam-nav-btn.is-current {
      border-color: var(--primary-dark);
      background-color: var(--primary);
      color: var(--text-primary);
      font-weight: 700;
      box-shadow: 0 0 0 2px rgba(201, 106, 10, 0.35);
    }

    .exam-legend {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(243, 197, 141, 0.6);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .exam-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      border: 1px solid var(--border-color);
      background-color: #FFFFFF;
      display: inline-block;
    }

    .legend-dot.is-current {
      border-color: var(--primary-dark);
      background-color: var(--primary);
    }

    .legend-dot.is-answered {
      border-color: var(--primary-dark);
      background-color: rgba(242, 140, 40, 0.25);
    }

    /* Resultados */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    @media (min-width: 640px) {
      .stats-grid {
        grid-template-columns: repeat(5, 1fr);
      }
      .stats-grid.is-exam {
        grid-template-columns: repeat(6, 1fr);

      // =========================================================================
      // 3. VALIDACIÓN INTERNA DEL BANCO DE PREGUNTAS
      // =========================================================================
      function validarBancoPreguntas() {
        const errores = [];
        const idsVistos = new Set();
        const enunciadosVistos = new Set();

        if (!Array.isArray(PREGUNTAS) || PREGUNTAS.length !== 150) {
          errores.push('El banco debe contener exactamente 150 preguntas.');
        }

        for (let i = 0; i < PREGUNTAS.length; i += 1) {
          const p = PREGUNTAS[i];
          if (idsVistos.has(p.id)) {
            errores.push('ID duplicado: ' + p.id);
          }
          idsVistos.add(p.id);

          const enun = String(p.enunciado || '').trim();
          if (!enun || enunciadosVistos.has(enun)) {
            errores.push('Enunciado vacío o duplicado en pregunta ' + p.id);
          }
          enunciadosVistos.add(enun);

          if (!p.epigrafe || !String(p.epigrafe).trim()) {
            errores.push('Epígrafe ausente en pregunta ' + p.id);
          }
          if (!p.explicacion || !String(p.explicacion).trim()) {
            errores.push('Explicación ausente en pregunta ' + p.id);
          }
          if (!LETRAS_OPCIONES.includes(p.correcta)) {
            errores.push('Respuesta correcta inválida en pregunta ' + p.id);
          }
          for (let j = 0; j < LETRAS_OPCIONES.length; j += 1) {
            const letra = LETRAS_OPCIONES[j];
            if (!p.opciones || !p.opciones[letra] || !String(p.opciones[letra]).trim()) {
              errores.push('Opción ' + letra + ' ausente en pregunta ' + p.id);
            }
          }
        }

        return { valido: errores.length === 0, errores: errores };
      }

      // =========================================================================
      // 4. UTILIDADES DE ESTADO, ALMACENAMIENTO SEGURO Y LÓGICA
      // =========================================================================
      const EXAM_QUESTION_COUNT = 37;
      const EXAM_DURATION_SECONDS = 40 * 60;
      const STORAGE_KEY_ERRORS = 'fol_trabajo_salud_mis_errores_v1';
      const STORAGE_KEY_LAST_EXAM = 'fol_trabajo_salud_ultimo_examen_v1';
      const memoriaFallback = {};

      function leerListaIds(clave) {
        let bruto = null;
        try {
          if (window.localStorage) {
            bruto = window.localStorage.getItem(clave);
          }
        } catch (_) {
          bruto = Object.prototype.hasOwnProperty.call(memoriaFallback, clave) ? memoriaFallback[clave] : null;
        }
        if (bruto === null && Object.prototype.hasOwnProperty.call(memoriaFallback, clave)) {
          bruto = memoriaFallback[clave];
        }
        if (!bruto) return [];
        try {
          const parsed = JSON.parse(bruto);
          if (!Array.isArray(parsed)) return [];
          const vistos = new Set();
          const res = [];
          for (let i = 0; i < parsed.length; i += 1) {
            const id = parsed[i];
            if (typeof id === 'number' && Number.isInteger(id) && !vistos.has(id)) {
              vistos.add(id);
              res.push(id);
            }
          }
          return res;
        } catch (_) {
          return [];
        }
      }

      function guardarListaIds(clave, ids) {
        const vistos = new Set();
        const unicos = [];
        for (let i = 0; i < ids.length; i += 1) {
          const id = ids[i];
          if (typeof id === 'number' && Number.isInteger(id) && !vistos.has(id)) {
            vistos.add(id);
            unicos.push(id);
          }
        }
        const serializado = JSON.stringify(unicos);
        memoriaFallback[clave] = serializado;
        try {
          if (window.localStorage) {
            window.localStorage.setItem(clave, serializado);
          }
        } catch (_) {
          // Respaldo en memoria activo si el entorno bloquea localStorage
        }
        return unicos;
      }

      function agregarErroresPendientes(idsNuevos) {
        const actuales = estado.erroresPendientesIds.slice();
        const vistos = new Set(actuales);
        let cambio = false;
        for (let i = 0; i < idsNuevos.length; i += 1) {
          const id = idsNuevos[i];
          if (!vistos.has(id)) {
            vistos.add(id);
            actuales.push(id);
            cambio = true;
          }
        }
        if (cambio) {
          estado.erroresPendientesIds = guardarListaIds(STORAGE_KEY_ERRORS, actuales);
        }
      }

      function quitarErrorPendiente(idResuelto) {
        if (estado.erroresPendientesIds.indexOf(idResuelto) === -1) return;
        const siguientes = estado.erroresPendientesIds.filter(function (id) { return id !== idResuelto; });
        estado.erroresPendientesIds = guardarListaIds(STORAGE_KEY_ERRORS, siguientes);
      }

      function obtenerPreguntasDeErroresPendientes() {
        const set = new Set(estado.erroresPendientesIds);
        return PREGUNTAS.filter(function (p) { return set.has(p.id); });
      }

      function escaparHtml(texto) {
        return String(texto)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function mezclarPreguntas(lista) {
        const copia = lista.slice();
        for (let i = copia.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = copia[i];
          copia[i] = copia[j];
          copia[j] = temp;
        }
        return copia;
      }

      function seleccionarPreguntasExamen(excluidosIds) {
        const excluidos = new Set(excluidosIds || []);
        const disponibles = PREGUNTAS.filter(function (p) { return !excluidos.has(p.id); });
        const pool = disponibles.length >= EXAM_QUESTION_COUNT ? disponibles : PREGUNTAS.slice();
        return mezclarPreguntas(pool).slice(0, EXAM_QUESTION_COUNT);
      }

      function formatearCuentaAtras(segundosTotales) {
        const seg = Math.max(0, Math.floor(segundosTotales));
        const min = Math.floor(seg / 60);
        const rem = seg % 60;
        return String(min).padStart(2, '0') + ':' + String(rem).padStart(2, '0');
      }

      function formatearDuracion(segundosTotales) {
        const seg = Math.max(0, Math.round(segundosTotales));
        const min = Math.floor(seg / 60);
        const rem = seg % 60;
        if (min === 0) return rem + ' s';
        return min + ' min ' + String(rem).padStart(2, '0') + ' s';
      }

      function obtenerPoolFiltrado(epigrafeId) {
        if (epigrafeId === 'all') return PREGUNTAS;
        return PREGUNTAS.filter(function (p) { return p.epigrafeId === epigrafeId; });
      }

      function obtenerOpcionesCantidad(totalPool, esTodos) {
        const base = [10, 20, 30, 50];
        const opciones = [];
        for (let i = 0; i < base.length; i += 1) {
          if (base[i] < totalPool) {
            opciones.push({ value: base[i], label: base[i] + ' preguntas', count: base[i] });
          }
        }
        opciones.push({
          value: 'all',
          label: esTodos ? 'Todas (' + totalPool + ')' : 'Todas las del epígrafe (' + totalPool + ')',
          count: totalPool
        });
        return opciones;
      }

      function resolverCantidadValida(actual, totalPool) {
        if (actual === 'all') return 'all';
        if (typeof actual === 'number' && actual < totalPool) return actual;
        return 'all';
      }

      function calcularResultados(preguntasSesion, respuestas) {
        let aciertos = 0;
        let falladasResp = 0;
        let sinResponder = 0;
        const preguntasFalladas = [];
        const mapaEpigrafes = {};

        for (let i = 0; i < preguntasSesion.length; i += 1) {
          const p = preguntasSesion[i];
          if (!mapaEpigrafes[p.epigrafeId]) {
            mapaEpigrafes[p.epigrafeId] = { epigrafeId: p.epigrafeId, epigrafe: p.epigrafe, aciertos: 0, total: 0 };
          }
          mapaEpigrafes[p.epigrafeId].total += 1;

          const elegida = respuestas[p.id];
          if (elegida === p.correcta) {
            aciertos += 1;
            mapaEpigrafes[p.epigrafeId].aciertos += 1;
          } else {
            preguntasFalladas.push(p);
            if (!elegida) sinResponder += 1;
            else falladasResp += 1;
          }
        }

        const total = preguntasSesion.length;
        const errores = total - aciertos;
        const porcentaje = total > 0 ? Math.round((aciertos / total) * 100) : 0;
        const nota = total > 0 ? (aciertos / total) * 10 : 0;

        const orden = {};
        for (let k = 0; k < EPIGRAFES.length; k += 1) {
          orden[EPIGRAFES[k].id] = k;
        }

        const desglose = Object.keys(mapaEpigrafes)
          .sort(function (a, b) { return (orden[a] ?? 999) - (orden[b] ?? 999); })
          .map(function (id) {
            const item = mapaEpigrafes[id];
            return {
              epigrafeId: item.epigrafeId,
              epigrafe: item.epigrafe,
              aciertos: item.aciertos,
              total: item.total,
              porcentaje: item.total > 0 ? Math.round((item.aciertos / item.total) * 100) : 0
            };
          });

        return {
          total: total,
          aciertos: aciertos,
          errores: errores,
          falladasResp: falladasResp,
          sinResponder: sinResponder,
          porcentaje: porcentaje,
          nota: nota,
          notaTexto: nota.toFixed(2).replace('.', ','),
          desglose: desglose,
          preguntasFalladas: preguntasFalladas
        };
      }

      function calcularResultadosExamen(preguntasExamen, respuestas, segundosEmpleo) {
        let aciertos = 0;
        let errores = 0;
        let enBlanco = 0;

        for (let i = 0; i < preguntasExamen.length; i += 1) {
          const p = preguntasExamen[i];
          const elegida = respuestas[p.id];
          if (!elegida) {
            enBlanco += 1;
          } else if (elegida === p.correcta) {
            aciertos += 1;
          } else {
            errores += 1;
          }
        }

        const total = preguntasExamen.length;
        const nota = total > 0 ? ((aciertos - (errores / 3)) * 10) / total : 0;

        return {
          total: total,
          aciertos: aciertos,
          errores: errores,
          enBlanco: enBlanco,
          nota: nota,
          notaTexto: nota.toFixed(2).replace('.', ','),
          segundosEmpleo: Math.max(0, Math.round(segundosEmpleo))
        };
      }

      function obtenerFeedbackMotivacional(nota, esRepaso) {
        if (nota === 10) {
          return {
            titulo: esRepaso ? 'Repaso completado sin errores' : 'Dominio sobresaliente',
            mensaje: esRepaso
              ? 'Has corregido todas las preguntas falladas y consolidado los contenidos del bloque.'
              : 'Has respondido correctamente a todas las preguntas de esta práctica. Excelente comprensión aplicada.'
          };
        }
        if (nota >= 8.5) {
          return {
            titulo: 'Resultado excelente',
            mensaje: 'Demuestras un sólido dominio de los conceptos y su aplicación práctica. Repasa los últimos fallos para alcanzar el 10.'
          };
        }
        if (nota >= 7) {
          return {
            titulo: 'Buen progreso',
            mensaje: 'Comprendes la mayoría de los epígrafes evaluados. Repetir las preguntas incorrectas te ayudará a afianzar los matices.'
          };
        }
        if (nota >= 5) {
          return {
            titulo: 'Nivel básico alcanzado',
            mensaje: 'Has superado la prueba, aunque conviene reforzar varios conceptos clave revisando tus errores.'
          };
        }
        return {
          titulo: 'Conviene seguir practicando',
          mensaje: 'Utiliza el repaso de preguntas incorrectas y la explicación didáctica de cada cuestión para consolidar las bases antes de un nuevo intento.'
        };
      }

        modalPendiente: null // null | 'home' | 'restart' | 'finish-incomplete' | 'exam-home' | 'exam-finish'
      };

      const validacion = validarBancoPreguntas();
      const appRoot = document.getElementById('app');
      const modalRoot = document.getElementById('modal-root');
      let examTimerIntervalId = null;

      function detenerRelojExamen() {
        if (examTimerIntervalId !== null) {
          window.clearInterval(examTimerIntervalId);
          examTimerIntervalId = null;
        }
      }

      function actualizarTextoReloj() {
        const el = document.getElementById('exam-timer-pill');
        const txt = document.getElementById('exam-timer-text');
        if (!el || !txt) return;
        txt.textContent = formatearCuentaAtras(estado.examenRestanteSeg);
        if (estado.examenRestanteSeg <= 300) el.classList.add('is-low');
        else el.classList.remove('is-low');
      }

      function sincronizarRelojExamen() {
        if (estado.pantalla !== 'exam' || estado.examenFinMs <= 0) return;
        const restante = Math.ceil((estado.examenFinMs - Date.now()) / 1000);
        if (restante <= 0) {
          estado.examenRestanteSeg = 0;
          finalizarExamen(true);
        } else {
          estado.examenRestanteSeg = restante;
          actualizarTextoReloj();
        }
      }

      function iniciarRelojExamen() {
        detenerRelojExamen();
        sincronizarRelojExamen();
        examTimerIntervalId = window.setInterval(sincronizarRelojExamen, 500);
      }

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && estado.pantalla === 'exam') {
          sincronizarRelojExamen();
        }
      });

      function contarResueltasPractica() {
        let count = 0;
        for (let i = 0; i < estado.preguntasSesion.length; i += 1) {
          const id = estado.preguntasSesion[i].id;
          if (estado.respuestas[id] || estado.omitidas[id]) count += 1;
        }
        return count;
      }

      function contarRespondidasExamen() {
        let count = 0;
        for (let i = 0; i < estado.preguntasExamen.length; i += 1) {
          if (estado.respuestasExamen[estado.preguntasExamen[i].id]) count += 1;
        }
        return count;
      }

      function iniciarCuestionario(epigrafeId, cantidad, mezclar) {
        detenerRelojExamen();
        const pool = obtenerPoolFiltrado(epigrafeId);
        const ordenadas = mezclar ? mezclarPreguntas(pool) : pool.slice();
        const seleccion = (cantidad === 'all' || cantidad >= ordenadas.length)
          ? ordenadas
          : ordenadas.slice(0, cantidad);

        estado.configBase = { epigrafeId: epigrafeId, cantidad: cantidad, mezclar: mezclar };
        estado.preguntasSesion = seleccion;
        estado.indiceActual = 0;
        estado.respuestas = {};
        estado.omitidas = {};
        estado.modoRepaso = false;
        estado.sesionMisErrores = false;
        estado.mostrarFalladas = false;
        estado.modalPendiente = null;
        estado.pantalla = 'quiz';
        renderizar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function iniciarMisErrores() {
        detenerRelojExamen();
        const pool = obtenerPreguntasDeErroresPendientes();
        if (!pool.length) return;
        estado.preguntasSesion = estado.mezclarOrden ? mezclarPreguntas(pool) : pool;
        estado.indiceActual = 0;
        estado.respuestas = {};
        estado.omitidas = {};
        estado.modoRepaso = false;
        estado.sesionMisErrores = true;
        estado.mostrarFalladas = false;
        estado.modalPendiente = null;
        estado.pantalla = 'quiz';
        renderizar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function iniciarExamen() {
        const seleccion = seleccionarPreguntasExamen(estado.ultimoExamenIds);
        const ids = seleccion.map(function (p) { return p.id; });
        estado.ultimoExamenIds = guardarListaIds(STORAGE_KEY_LAST_EXAM, ids);

        const ahora = Date.now();
        estado.preguntasExamen = seleccion;
        estado.indiceExamen = 0;
        estado.respuestasExamen = {};
        estado.examenInicioMs = ahora;
        estado.examenFinMs = ahora + EXAM_DURATION_SECONDS * 1000;
        estado.examenRestanteSeg = EXAM_DURATION_SECONDS;
        estado.examenEmpleoSeg = 0;
        estado.examenAgotado = false;
        estado.mostrarNavMovil = false;
        estado.mostrarRevisionExamen = false;
        estado.filtroRevisionExamen = 'all';
        estado.modalPendiente = null;
        estado.modoInicio = 'exam';
        estado.pantalla = 'exam';
        renderizar();
        iniciarRelojExamen();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function finalizarPracticaConfirmada() {
        const sinContestarIds = [];
        for (let i = 0; i < estado.preguntasSesion.length; i += 1) {
          const id = estado.preguntasSesion[i].id;
          if (!estado.respuestas[id] && !estado.omitidas[id]) {
            sinContestarIds.push(id);
          }
        }
        if (sinContestarIds.length > 0) {
          agregarErroresPendientes(sinContestarIds);
        }
        estado.pantalla = 'results';
        renderizar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function finalizarExamen(porTiempo) {
        detenerRelojExamen();
        const transcurrido = Math.round((Date.now() - estado.examenInicioMs) / 1000);
        estado.examenEmpleoSeg = porTiempo
          ? EXAM_DURATION_SECONDS
          : Math.min(EXAM_DURATION_SECONDS, Math.max(0, transcurrido));
        estado.examenAgotado = Boolean(porTiempo);
        estado.modalPendiente = null;
        estado.pantalla = 'exam-results';
        renderizar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function renderizarCuestionario() {
        appRoot.className = 'container';
        const total = estado.preguntasSesion.length;
        const p = estado.preguntasSesion[estado.indiceActual];
        if (!p) return;

        const elegida = estado.respuestas[p.id];
        const estaOmitida = Boolean(estado.omitidas[p.id]);
        const resuelta = Boolean(elegida) || estaOmitida;
        const esCorrecta = Boolean(elegida) && elegida === p.correcta;
        const resueltasTotal = contarResueltasPractica();
        const progresoPct = total > 0 ? Math.round(((estado.indiceActual + 1) / total) * 100) : 0;
        const esUltima = estado.indiceActual === total - 1;

        let opcionesHtml = '';
        for (let i = 0; i < LETRAS_OPCIONES.length; i += 1) {
          const letra = LETRAS_OPCIONES[i];
          const esElegida = elegida === letra;
          const esLaCorrecta = p.correcta === letra;
          let clase = 'option-btn';
          let iconoEstado = '';

          if (resuelta) {
            if (esLaCorrecta) {
              clase += ' is-correct';
              iconoEstado = '<span style="color:var(--success);flex-shrink:0;margin-top:2px;">' + ICONS.check + '</span>';
            } else if (esElegida && !esLaCorrecta) {
              clase += ' is-wrong';
              iconoEstado = '<span style="color:var(--error);flex-shrink:0;margin-top:2px;">' + ICONS.error + '</span>';
            } else {
              clase += ' is-muted';
            }
          }

          opcionesHtml +=
            '<button type="button" class="' + clase + '" data-option="' + letra + '"' + (resuelta ? ' disabled' : '') + ' aria-pressed="' + esElegida + '">' +
              '<span class="option-letter">' + letra + '</span>' +
              '<span class="option-text">' + escaparHtml(p.opciones[letra]) + '</span>' +
              iconoEstado +
            '</button>';
        }

        let feedbackHtml = '';
        if (resuelta) {
          const claseFb = esCorrecta ? 'is-correct' : (estaOmitida ? 'is-omitted' : 'is-wrong');
          const estadoTxt = esCorrecta
            ? ICONS.check + '<span>Respuesta correcta · Eliminada de «Mis errores» si estaba pendiente</span>'
            : (estaOmitida
              ? ICONS.minus + '<span>Pregunta dejada en blanco · Añadida a «Mis errores» · La opción correcta es la ' + p.correcta + '</span>'
              : ICONS.error + '<span>Respuesta incorrecta · Añadida a «Mis errores» · La opción correcta es la ' + p.correcta + '</span>');

          feedbackHtml =
            '<section class="feedback-box ' + claseFb + '" aria-live="polite">' +
              '<div class="feedback-status">' + estadoTxt + '</div>' +
              '<div class="feedback-body">' +

        const epigrafeLinea = p.subepigrafe ? p.epigrafe + ' · ' + p.subepigrafe : p.epigrafe;
        const etiquetaModo = estado.sesionMisErrores
          ? 'Modo práctica: Mis errores pendientes'
          : (estado.modoRepaso ? 'Modo práctica: Repaso de errores' : 'Modo práctica');

        appRoot.innerHTML =
          '<header class="quiz-topbar">' +

              '<div style="display:flex;align-items:center;gap:10px;">' +

                '<span class="badge-errors-pill">' + ICONS.bookmarkX + '<span class="tabular-nums">Mis errores (' + estado.erroresPendientesIds.length + ')</span></span>' +
              '</div>' +

            '</div>' +
            '<div class="progress-meta">' +
              '<span>' + etiquetaModo + '</span>' +
              '<span class="tabular-nums">' + resueltasTotal + ' de ' + total + ' completadas</span>' +
            '</div>' +
            '<div class="progress-track" role="progressbar" aria-valuenow="' + (estado.indiceActual + 1) + '" aria-valuemin="1" aria-valuemax="' + total + '">' +
              '<div class="progress-fill" style="width:' + progresoPct + '%;"></div>' +

        appRoot.querySelectorAll('[data-option]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (estado.respuestas[p.id] || estado.omitidas[p.id]) return;
            const letra = btn.getAttribute('data-option');
            estado.respuestas[p.id] = letra;
            if (letra === p.correcta) {
              quitarErrorPendiente(p.id);
            } else {
              agregarErroresPendientes([p.id]);
            }
            renderizar();
          });
        });

        const btnOmit = document.getElementById('btn-omit');
        if (btnOmit) {
          btnOmit.addEventListener('click', function () {
            if (estado.respuestas[p.id] || estado.omitidas[p.id]) return;
            estado.omitidas[p.id] = true;
            agregarErroresPendientes([p.id]);
            renderizar();
          });
        }

        const btnPrev = document.getElementById('btn-prev');
        if (btnPrev) {
          btnPrev.addEventListener('click', function () {
            if (estado.indiceActual > 0) {
              estado.indiceActual -= 1;
              renderizar();
            }
          });

        if (btnNext) {
          btnNext.addEventListener('click', function () {
            if (estado.indiceActual < total - 1) {
              estado.indiceActual += 1;
              renderizar();

        const manejarFin = function () {
          if (contarResueltasPractica() < total) {
            estado.modalPendiente = 'finish-incomplete';
            renderizarModal();
          } else {
            finalizarPracticaConfirmada();
          }
        };

        const btnFinish = document.getElementById('btn-finish');
        if (btnFinish) btnFinish.addEventListener('click', manejarFin);
        const btnFinishEarly = document.getElementById('btn-finish-early');
        if (btnFinishEarly) btnFinishEarly.addEventListener('click', manejarFin);

        const btnHome = document.getElementById('btn-home');
        if (btnHome) {
          btnHome.addEventListener('click', function () {
            if (contarResueltasPractica() > 0) {
              estado.modalPendiente = 'home';
              renderizarModal();
            } else {
              estado.pantalla = 'home';
              renderizar();
            }
          });
        }

        const btnRestart = document.getElementById('btn-restart');
        if (btnRestart) {
          btnRestart.addEventListener('click', function () {
            if (contarResueltasPractica() > 0) {
              estado.modalPendiente = 'restart';
              renderizarModal();
            } else {
              estado.indiceActual = 0;
              renderizar();
            }
          });
        }
      }

      function renderizarResultados() {
        appRoot.className = 'container is-results';
        const res = calcularResultados(estado.preguntasSesion, estado.respuestas);
        const fb = obtenerFeedbackMotivacional(res.nota, estado.modoRepaso || estado.sesionMisErrores);
        const nPendientes = estado.erroresPendientesIds.length;

        let accionRepasoHtml = '';
        if (res.errores > 0) {
          accionRepasoHtml =
            '<div class="retry-banner">' +

                '<p style="margin:4px 0 0;font-size:14px;color:var(--text-secondary);">Tienes <strong class="tabular-nums">' + nPendientes + '</strong> ' + (nPendientes === 1 ? 'pregunta guardada en «Mis errores».' : 'preguntas guardadas en «Mis errores».') + ' Puedes repetir los fallos de este bloque hasta dejarlos a cero.</p>' +
              '</div>' +
              '<button type="button" id="btn-retry-errors" class="btn-primary" style="flex-shrink:0;">' + ICONS.refresh + '<span>Repetir preguntas pendientes (' + res.errores + ')</span></button>' +

      function renderizarGridNavegadorExamen() {
        let html = '<div class="exam-nav-grid">';
        for (let i = 0; i < estado.preguntasExamen.length; i += 1) {
          const q = estado.preguntasExamen[i];
          const esActual = i === estado.indiceExamen;
          const estaRespondida = Boolean(estado.respuestasExamen[q.id]);
          let clase = 'exam-nav-btn';
          if (estaRespondida) clase += ' is-answered';
          if (esActual) clase += ' is-current';
          html +=
            '<button type="button" class="' + clase + ' tabular-nums" data-jump="' + i + '" aria-label="Pregunta ' + (i + 1) + (estaRespondida ? ', respondida' : ', en blanco') + (esActual ? ', actual' : '') + '"' + (esActual ? ' aria-current="step"' : '') + '>' + (i + 1) + '</button>';
        }
        html += '</div>';
        return html;
      }

      function renderizarExamen() {
        appRoot.className = 'container is-exam';
        const total = estado.preguntasExamen.length;
        const p = estado.preguntasExamen[estado.indiceExamen];
        if (!p) return;

        const elegida = estado.respuestasExamen[p.id];
        const respondidasTotal = contarRespondidasExamen();
        const enBlancoTotal = total - respondidasTotal;
        const progresoPct = total > 0 ? Math.round((respondidasTotal / total) * 100) : 0;
        const esUltima = estado.indiceExamen === total - 1;
        const tiempoBajo = estado.examenRestanteSeg <= 300;

        let opcionesHtml = '';
        for (let i = 0; i < LETRAS_OPCIONES.length; i += 1) {

            '<button type="button" class="option-btn' + (esElegida ? ' is-selected-exam' : '') + '" data-exam-opt="' + letra + '" aria-pressed="' + esElegida + '">' +
              '<span class="option-letter">' + letra + '</span>' +
              '<span class="option-text">' + escaparHtml(p.opciones[letra]) + '</span>' +

                '<div id="exam-timer-pill" role="timer" aria-live="off" class="timer-pill tabular-nums' + (tiempoBajo ? ' is-low' : '') + '">' +

                '</div>' +
              '</div>' +
              '<div style="display:flex;align-items:center;gap:8px;">' +
                '<button type="button" id="btn-exam-nav-toggle" class="btn-secondary exam-mobile-nav-btn" style="min-height:38px;padding:6px 12px;" aria-expanded="' + estado.mostrarNavMovil + '">' + ICONS.grid + '<span>Índice (' + respondidasTotal + '/' + total + ')</span></button>' +

          '<div class="exam-layout">' +
            '<article class="card">' +

              delete estado.respuestasExamen[p.id];
            } else {
              estado.respuestasExamen[p.id] = letra;
            }
            renderizar();
          });
        });

        appRoot.querySelectorAll('[data-jump]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            estado.indiceExamen = Number(btn.getAttribute('data-jump'));
            estado.mostrarNavMovil = false;
            renderizar();

        const clearBtn = document.getElementById('btn-exam-clear');
        if (clearBtn) {
          clearBtn.addEventListener('click', function () {
            delete estado.respuestasExamen[p.id];
            renderizar();
          });

        if (finFoot) finFoot.addEventListener('click', abrirFinExamen);

        if (finSide) finSide.addEventListener('click', abrirFinExamen);

            '</div>' +

            '<div style="margin-top:12px;padding:10px 14px;border-radius:8px;border:1px solid rgba(243,197,141,0.7);background:rgba(255,243,229,0.6);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-secondary);">' +
              '<span style="display:inline-flex;align-items:center;gap:6px;color:var(--text-primary);font-weight:500;">' + ICONS.clock + '<span>Tiempo empleado: <strong class="tabular-nums">' + formatearDuracion(res.segundosEmpleo) + '</strong></span></span>' +
              '<span class="tabular-nums">Fórmula aplicada: (' + res.aciertos + ' − ' + res.errores + '/3) × 10 / 37 = ' + res.notaTexto + '</span>' +
            '</div>' +

            '<section class="section-block">' +
              '<button type="button" id="btn-toggle-exam-review" class="failed-toggle" aria-expanded="' + estado.mostrarRevisionExamen + '">' +
                '<span>Ver revisión y explicaciones de las 37 preguntas</span>' +
                (estado.mostrarRevisionExamen ? ICONS.chevronUp : ICONS.chevronDown) +
              '</button>' +
              revisionHtml +
            '</section>' +

            '<footer class="quiz-footer" style="margin-top:24px;">' +
              '<button type="button" id="btn-exam-results-home" class="btn-secondary">' + ICONS.home + '<span>Volver al inicio</span></button>' +
              '<button type="button" id="btn-exam-new" class="btn-primary">' + ICONS.grad + '<span>Realizar otro examen</span></button>' +
            '</footer>' +
          '</section>';

        document.getElementById('btn-toggle-exam-review').addEventListener('click', function () {
          estado.mostrarRevisionExamen = !estado.mostrarRevisionExamen;
          renderizar();
        });

        appRoot.querySelectorAll('[data-exam-filter]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            estado.filtroRevisionExamen = btn.getAttribute('data-exam-filter');
            renderizar();
          });
        });

        document.getElementById('btn-exam-results-home').addEventListener('click', function () {
          estado.modoInicio = 'exam';
          estado.pantalla = 'home';
          renderizar();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('btn-exam-new').addEventListener('click', iniciarExamen);
      }

      function renderizarModal() {
        if (!estado.modalPendiente) {
          modalRoot.innerHTML = '';
          return;
        }

        let titulo = '';
        let descripcion = '';
        let textoConfirmar = '';
        let esPeligro = true;

        if (estado.modalPendiente === 'home') {
          titulo = '¿Volver al inicio?';
          descripcion = 'Si sales ahora perderás el progreso de la sesión actual (las respuestas ya evaluadas permanecen actualizadas en «Mis errores»).';
          textoConfirmar = 'Salir al inicio';
        } else if (estado.modalPendiente === 'restart') {
          titulo = '¿Reiniciar esta práctica?';
          descripcion = 'Se borrarán las respuestas marcadas en este intento y comenzarás de nuevo desde la primera pregunta.';
          textoConfirmar = 'Reiniciar práctica';
        } else if (estado.modalPendiente === 'finish-incomplete') {
          const sinResponder = estado.preguntasSesion.length - contarResueltasPractica();
          titulo = 'Hay preguntas sin responder';
          descripcion = 'Todavía quedan ' + sinResponder + (sinResponder === 1 ? ' pregunta sin contestar' : ' preguntas sin contestar') + '. Si finalizas ahora, se añadirán a «Mis errores» para que puedas repasarlas.';
          textoConfirmar = 'Finalizar igualmente';
          esPeligro = false;
        } else if (estado.modalPendiente === 'exam-home') {
          titulo = '¿Abandonar el examen?';
          descripcion = 'Si vuelves al inicio ahora, el examen en curso se cancelará y no se calculará la nota.';
          textoConfirmar = 'Abandonar examen';
        } else if (estado.modalPendiente === 'exam-finish') {
          const respondidas = contarRespondidasExamen();
          const enBlanco = estado.preguntasExamen.length - respondidas;
          titulo = '¿Finalizar examen y ver resultados?';
          descripcion = enBlanco > 0
            ? 'Has respondido ' + respondidas + ' de ' + estado.preguntasExamen.length + ' preguntas y quedan ' + enBlanco + ' en blanco (las preguntas en blanco puntúan 0 y los errores restan 1/3). ¿Deseas entregar el examen?'
            : 'Has respondido las ' + estado.preguntasExamen.length + ' preguntas del examen. ¿Deseas entregarlo y calcular tu calificación definitiva?';
          textoConfirmar = 'Entregar examen';
          esPeligro = false;
        }

        modalRoot.innerHTML =
          '<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
            '<div class="modal-card">' +
              '<div class="modal-header">' +
                '<div class="modal-icon">' + ICONS.alert + '</div>' +
                '<div>' +
                  '<h2 id="modal-title" style="margin:0;font-size:16px;font-weight:600;color:var(--text-primary);">' + titulo + '</h2>' +
                  '<p style="margin:6px 0 0;font-size:14px;color:var(--text-secondary);line-height:1.5;">' + descripcion + '</p>' +
                '</div>' +
              '</div>' +
              '<div class="modal-actions">' +
                '<button type="button" id="modal-cancel" class="btn-secondary">Cancelar</button>' +
                '<button type="button" id="modal-confirm" class="' + (esPeligro ? 'btn-danger' : 'btn-primary') + '">' + textoConfirmar + '</button>' +
              '</div>' +
            '</div>' +
          '</div>';

        const cancelBtn = document.getElementById('modal-cancel');
        const confirmBtn = document.getElementById('modal-confirm');
        if (cancelBtn) {
          cancelBtn.focus();
          cancelBtn.addEventListener('click', function () {
            estado.modalPendiente = null;
            renderizarModal();
          });
        }
        if (confirmBtn) {
          confirmBtn.addEventListener('click', function () {
            const accion = estado.modalPendiente;
            estado.modalPendiente = null;
            renderizarModal();
            if (accion === 'home') {
              estado.respuestas = {};
              estado.omitidas = {};
              estado.indiceActual = 0;
              estado.pantalla = 'home';
              renderizar();
            } else if (accion === 'restart') {
              estado.respuestas = {};
              estado.omitidas = {};
              estado.indiceActual = 0;
              if (estado.sesionMisErrores) {
                const pool = obtenerPreguntasDeErroresPendientes();
                if (!pool.length) {
                  estado.pantalla = 'home';
                } else {
                  estado.preguntasSesion = estado.mezclarOrden ? mezclarPreguntas(pool) : pool;
                }
                renderizar();
              } else if (estado.modoRepaso) {
                estado.preguntasSesion = estado.mezclarOrden
                  ? mezclarPreguntas(estado.preguntasSesion)
                  : estado.preguntasSesion.slice();
                renderizar();
              } else {
                iniciarCuestionario(estado.configBase.epigrafeId, estado.configBase.cantidad, estado.configBase.mezclar);
              }
            } else if (accion === 'finish-incomplete') {
              finalizarPracticaConfirmada();
            } else if (accion === 'exam-home') {
              detenerRelojExamen();
              estado.preguntasExamen = [];
              estado.respuestasExamen = {};
              estado.examenFinMs = 0;
              estado.pantalla = 'home';
              renderizar();
            } else if (accion === 'exam-finish') {
              finalizarExamen(false);
            }
          });
        }
      }

      function renderizar() {
        if (!validacion.valido) {
          appRoot.innerHTML =
            '<section class="card" style="border-color:var(--error);background-color:var(--error-soft);">' +
              '<h1 style="margin:0;font-size:18px;color:var(--error);">Error de validación del banco</h1>' +
              '<p style="margin:8px 0 0;font-size:14px;">' + escaparHtml(validacion.errores.join('; ')) + '</p>' +
            '</section>';
          return;
        }
        if (estado.pantalla === 'home') renderizarInicio();
        else if (estado.pantalla === 'quiz') renderizarCuestionario();
        else if (estado.pantalla === 'results') renderizarResultados();
        else if (estado.pantalla === 'exam') renderizarExamen();
        else renderizarResultadosExamen();
        renderizarModal();
      }

      // Atajos de teclado accesibles
      window.addEventListener('keydown', function (e) {
        if (estado.modalPendiente) {
          if (e.key === 'Escape') {
            e.preventDefault();
            estado.modalPendiente = null;
            renderizarModal();
          }
          return;
        }

        if (estado.pantalla === 'quiz') {
          const p = estado.preguntasSesion[estado.indiceActual];
          if (!p) return;
          if (!estado.respuestas[p.id] && !estado.omitidas[p.id]) {
            const mapa = { '1': 'A', a: 'A', A: 'A', '2': 'B', b: 'B', B: 'B', '3': 'C', c: 'C', C: 'C', '4': 'D', d: 'D', D: 'D' };
            if (mapa[e.key]) {
              e.preventDefault();
              const letra = mapa[e.key];
              estado.respuestas[p.id] = letra;
              if (letra === p.correcta) quitarErrorPendiente(p.id);
              else agregarErroresPendientes([p.id]);
              renderizar();
              return;
            }
          }
          if (e.key === 'ArrowLeft' && estado.indiceActual > 0) {
            e.preventDefault();
            estado.indiceActual -= 1;
            renderizar();
          } else if (e.key === 'ArrowRight' && estado.indiceActual < estado.preguntasSesion.length - 1) {
            e.preventDefault();
            estado.indiceActual += 1;
            renderizar();
          }
        } else if (estado.pantalla === 'exam') {
          const p = estado.preguntasExamen[estado.indiceExamen];
          if (!p) return;
          const mapa = { '1': 'A', a: 'A', A: 'A', '2': 'B', b: 'B', B: 'B', '3': 'C', c: 'C', C: 'C', '4': 'D', d: 'D', D: 'D' };
          if (mapa[e.key]) {
            e.preventDefault();
            const letra = mapa[e.key];
            if (estado.respuestasExamen[p.id] === letra) delete estado.respuestasExamen[p.id];
            else estado.respuestasExamen[p.id] = letra;
            renderizar();
            return;
          }
          if (e.key === 'ArrowLeft' && estado.indiceExamen > 0) {
            e.preventDefault();
            estado.indiceExamen -= 1;
            renderizar();
          } else if (e.key === 'ArrowRight' && estado.indiceExamen < estado.preguntasExamen.length - 1) {
            e.preventDefault();
            estado.indiceExamen += 1;
            renderizar();
          }
        }
      });

      renderizar();
    })();
  </script>
</body>
</html>
